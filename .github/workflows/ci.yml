name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: M0/M1 simulated smoke
        run: ./scripts/smoke.sh

  aura:
    runs-on: ubuntu-latest
    # Optional: green-skip when no aura binary is provisioned on the runner.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Optional Aura mutate/eval smoke
        env:
          AURA_BIN: ${{ vars.AURA_BIN }}
          AURA_REF: ${{ vars.AURA_REF }}
        run: ./scripts/aura_smoke.sh
